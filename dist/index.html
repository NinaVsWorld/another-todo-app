<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoLister</title>
<script defer src="main.js"></script></head>
<body>
    <div class="header">
        <h1>
            DoLister
            <!--add and svg here for the menu collapse button-->
        </h1>
    </div>
    <div class="menu">
        <div class="inboxes">
            <div class="add-task">
                <!--add svg for +-->
                Add Task
            </div>
            <div class="search">
                <!--add svg for search-->
                Search
            </div>
            <div class="inbox">
                <!--add svg for inbox-->
                Inbox
            </div>
            <div class="today">
                <!--add svg for today-->
                Today
            </div>
            <div class="upcoming">
                <!--add svg for upcoming-->
                Upcoming
            </div>
            <div class="completed">
                <!--add svg for completed-->
                Completed
            </div>
        </div>
        <div class="projects">
            <div class="myprojects-heading">
                <div class="my-projects">My Projects</div>
                <!--add svg for projects add button-->
                <button class="add-proj">Add</button>
            </div>
            <!--dynamically add projects here-->
            <div class="projects-list"></div>
        </div>
    </div>
    <div class="list">
        <div class="list-container">
            <h2 id="page-title"></h2>
            <div class="class-list"></div>
            <button class=add-task class="add-task-btn">Add Task</button>
        </div>
    </div>
</body>

<!--task form-->
<dialog class="task-form">
    <form id="registration-form">
        <div class="title">
            <label for="title">Title</label>
            <input type="text" class="task-title" id="task-title" required placeholder="Task Title" required>
        </div>
        <div class="description">
            <label for="description">Description</label>
            <textarea name="description" id="description">Description</textarea>
        </div>
        <div class="due-date">
            <label for="due-date">Due Date</label>
            <input type="date" class="due-date" id="due-date" value="yyyy-MM-dd" min="1900-01-01" max="3000-01-01" required>
        </div>
        <div class="priority">
            <label for="Priority">Priority</label>
            <select name="priority" id=priority">
                <option value="0">Low</option>
                <option value="1">Medium</option>
                <option value="2">High</option>
            </select>
        </div>
        <div class="project">
            <label for="inbox">Inbox</label>
            <!--dynamically update the inbox/project options-->
            <select name="projects" id="projects"></select>
        </div>
        <div class="buttons">
            <button type="button" class="create-task">Create Task</button>
            <button type="button" class="cancel">Cancel</button>
        </div>
    </form>
</dialog>

<!--project form-->
<dialog class="project-form">
    <form>
        <div class="title">
            <label for="title">Title</label>
            <input type="text" class="project-title" id="project-title" required placeholder="Project title">
        </div>
        <div class="buttons">
            <button type="button" class="create-project">Create Project</button>
            <button type="button" class="cancel">Cancel</button>
        </div>
    </form>
</dialog>

<!--task card-->
<div class="task-card">
    <div class="radio-button">
        <input type="radio" id="task-item" name="task-item" checked>
        <!--dynamicall updated from user input-->
        <label for="task-item"></label>
    </div>
    <div class="details">
        <!--dynamically updated from user input-->
        <div class="date-text">DD-MM-YYYY</div>
        <div class="priority-display">Priority</div>
        <div class="options">. . .</div>
    </div>
</div>

<!--project card-->
<div class="project-card">
    <div class="title-icon">
        <!--svg for project icon-->
        <!--dynamically update from user input-->
        <div class="card-title">project</div>
    </div>
    <div class="options">. . .</div>
</div>

<!--options menu for task/project-->
<div class="options-menu">
    <div class="edit">
        <!--svg for edit-->
        Edit Task
    </div>
    <div class="delete">
        <!--svg for delete-->
        Delete
    </div>
</div>
</html>
