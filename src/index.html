<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
</head>
<body>
    <header>
        <div class="board-title">Board Title</div>
    </header>

    <body>
        <div class="container">
            <button class="add-list">Add another list</button>
        </div>
        <div class="footer">
            <!-- where the buttons to switch projects/boards will be -->
             <button class="switch-board">Switch Projects</button>
        </div>

        <!-- template for list -->
        <template class="list-template">
            <!-- Main container for the column -->
            <div class="list-wrapper" data-list-id="">
                <div class="list-header">
                    <h2 class="list-title"></h2>
                    <div class="list-controls">
                        <span class="todo-count">0</span>
                        <button class="delete-list">Delete</button>
                    </div>
                </div>

                <!-- todo cards go here -->
                 <div class="todos-container"></div>
                 <footer class="list-card-footer">
                    <button class="add-todo">Add todo</button>
                 </footer>
            </div>
        </template>

        <!-- template for todo -->
         <template class="todo-template">
            <!-- individual card -->
            <div class="card-wrapper" data-todo-id="">
                <h3 class="card-title"></h3>
                <span class="badges">
                    <span class="duedate"></span>
                </span>
            </div>
         </template>
    </body>
</body>
</html>
