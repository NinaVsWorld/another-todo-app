<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoLister</title>
<script defer src="main.js"></script></head>
<body>
    <div class="menu">
        <div class="header">
            <svg id="app-icon" class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 4h3a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3m0 3h6m-6 7 2 2 4-4m-5-9v4h4V3h-4Z"/></svg>
            <h1 id="dolister">DoLister</h1>
        </div>
        <div class="search-add">
            <div class= "add-task" id="add-task-sidebar">
                <!--add svg for +-->
                <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 7.757v8.486M7.757 12h8.486M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
                <p>Add Task</p>
            </div>
            <div id="search" data-id="search">
                <!--add svg for search-->
                <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"/></svg>
                <p>Search</p>
            </div>
        </div>
        <div class="inboxes">
            <div id="inbox" data-id="inbox">
                <!--add svg for inbox-->
                <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 13h3.439a.991.991 0 0 1 .908.6 3.978 3.978 0 0 0 7.306 0 .99.99 0 0 1 .908-.6H20M4 13v6a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-6M4 13l2-9h12l2 9"/></svg>
                <p>Inbox</p>
            </div>
            <div id="today" data-id="today">
                <!--add svg for today-->
                <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5.365V3m0 2.365a5.338 5.338 0 0 1 5.133 5.368v1.8c0 2.386 1.867 2.982 1.867 4.175 0 .593 0 1.193-.538 1.193H5.538c-.538 0-.538-.6-.538-1.193 0-1.193 1.867-1.789 1.867-4.175v-1.8A5.338 5.338 0 0 1 12 5.365Zm-8.134 5.368a8.458 8.458 0 0 1 2.252-5.714m14.016 5.714a8.458 8.458 0 0 0-2.252-5.714M8.54 17.901a3.48 3.48 0 0 0 6.92 0H8.54Z"/></svg>
                <p>Today</p>
            </div>
            <div id="this-week" data-id="this-week">
                <!--add svg for upcoming-->
                <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 10h16M8 14h8m-4-7V4M7 7V4m10 3V4M5 20h14a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1Z"/></svg>
                <p>This Week</p>
            </div>
            <div id="next-week" data-id="next-week">
                <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 10h16m-8-3V4M7 7V4m10 3V4M5 20h14a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1Zm3-7h.01v.01H8V13Zm4 0h.01v.01H12V13Zm4 0h.01v.01H16V13Zm-8 4h.01v.01H8V17Zm4 0h.01v.01H12V17Zm4 0h.01v.01H16V17Z"/></svg>
                <p>Next Week</p>
            </div>
            <div id="completed" data-id="completed">
                <!--add svg for completed-->
                <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.5 11.5 11 14l4-4m6 2a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
                <p>Completed</p>
            </div>
        </div>
        <div class="projects">
            <div class="myprojects-heading">
                <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 19V6a1 1 0 0 1 1-1h4.032a1 1 0 0 1 .768.36l1.9 2.28a1 1 0 0 0 .768.36H16a1 1 0 0 1 1 1v1M3 19l3-8h15l-3 8H3Z"/></svg>
                <p class="my-projects">My Projects</p>
                <button class="add-proj">
                    <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14m-7 7V5"/></svg>
                </button>
            </div>
            <!--dynamically add projects here-->
            <div class="projects-list"></div>
        </div>
    </div>
    <div class="list">
        <div class="list-container">
            <h2 id="page-title"></h2>
            <div id="task-list"></div>
            <button class="add-task" id="add-task-btn">Add Task</button>
        </div>
    </div>
</body>

<!--task form-->
<dialog class="task-form">
    <form method="dialog" id="registration-form">
        <div class="title">
            <label for="title">Title</label>
            <input type="text" class="task-title" id="task-title" required placeholder="Task Title" required>
        </div>
        <div class="description">
            <label for="description">Description</label>
            <textarea name="description" id="description">Description</textarea>
        </div>
        <div class="due-date">
            <label for="due-date">Due Date</label>
            <input type="date" class="due-date" id="due-date" value="yyyy-MM-dd" min="1900-01-01" max="3000-01-01" required>
        </div>
        <div class="priority">
            <label for="Priority">Priority</label>
            <select name="priority" id="priority">
                <option value="0">Low</option>
                <option value="1">Medium</option>
                <option value="2">High</option>
            </select>
        </div>
        <div class="project">
            <label for="inbox">Inbox</label>
            <!--dynamically update the inbox/project options-->
            <select name="projects" class="project-options" id="projects"></select>
        </div>
        <div class="buttons">
            <button type="submit" value="confirm" class="create-task">Create Task</button>
            <button type="submit" value="cancel" formnovalidate class="cancel">Cancel</button>
        </div>
    </form>
</dialog>

<dialog id="edit-task-form">
    <form method="dialog" id="registration-form">
        <div class="title">
            <label for="title">Title</label>
            <input type="text" class="task-title" id="edit-task-title" required placeholder="Task Title" required>
        </div>
        <div class="description">
            <label for="description">Description</label>
            <textarea name="description" id="edit-description">Description</textarea>
        </div>
        <div class="due-date">
            <label for="due-date">Due Date</label>
            <input type="date" class="due-date" id="edit-due-date" min="1900-01-01" max="3000-01-01" required>
        </div>
        <div class="priority">
            <label for="Priority">Priority</label>
            <select name="priority" id="edit-priority">
                <option value="0">Low</option>
                <option value="1">Medium</option>
                <option value="2">High</option>
            </select>
        </div>
        <div class="project">
            <label for="inbox">Inbox</label>
            <!--dynamically update the inbox/project options-->
            <select name="projects" class="project-options" id="edit-projects"></select>
        </div>
        <div class="buttons">
            <button type="submit" value="confirm" id="edit-task">Edit</button>
            <button type="submit" value="cancel" formnovalidate class="cancel">Cancel</button>
        </div>
    </form>
</dialog>

<!--project form-->
<dialog class="project-form">
    <form method="dialog">
        <div class="title">
            <label for="title">Title</label>
            <input type="text" class="project-title" id="project-title" required placeholder="Project title">
        </div>
        <div class="buttons">
            <button type="submit" value="confirm" class="create-project">Create Project</button>
            <button type="submit" formnovalidate value="cancel" class="cancel">Cancel</button>
        </div>
    </form>
</dialog>

<!--edit project menu-->
<dialog id="edit-project-form">
    <form method="dialog">
        <div class="title">
            <label for="title">Title</label>
            <input type="text" class="project-title" id="edited-project-title" required>
        </div>
        <div class="buttons">
            <button type="submit" value="confirm" id="edit">Edit</button>
            <button type="submit" formnovalidate value="cancel" id="cancel-edit">Cancel</button>
        </div>
    </form>
</dialog>

<!--task card-->
<div class="task-card">
    <div class="radio-button">
        <input type="checkbox" id="complete-task" name="task-item">
        <!--dynamicall updated from user input-->
        <label for="complete-task" id="task-item"></label>
    </div>
    <div class="details">
        <!--dynamically updated from user input-->
        <div id="date-text"></div>
        <div id="priority-display"></div>

        <div class="ellipse-menu">
            <button class="menu-btn" aria-label="More options" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <ul class="menu-dropdown">
                <li id="edit-task">
                    <svg class="w-[48px] h-[48px] text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.779 17.779 4.36 19.918 6.5 13.5m4.279 4.279 8.364-8.643a3.027 3.027 0 0 0-2.14-5.165 3.03 3.03 0 0 0-2.14.886L6.5 13.5m4.279 4.279L6.499 13.5m2.14 2.14 6.213-6.504M12.75 7.04 17 11.28"/></svg>
                    <p>Edit</p>
                </li>
                <li id="delete">
                    <svg class="w-[48px] h-[48px] text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 7h14m-9 3v8m4-8v8M10 3h4a1 1 0 0 1 1 1v3H9V4a1 1 0 0 1 1-1ZM6 7h12v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V7Z"/></svg>
                    <p>Delete</p>
                </li>
            </ul>
        </div>
    </div>
</div>

<!--project card-->
<div class="project-card">
    <div class="title-icon">
        <svg class="w-[48px] h-[48px] text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 0 0-2 2v4m5-6h8M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m0 0h3a2 2 0 0 1 2 2v4m0 0v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-6m18 0s-4 2-9 2-9-2-9-2m9-2h.01"/></svg>
        <!--dynamically update from user input-->
        <div class="card-title">project</div>
    </div>
    <div class="ellipse-menu">
        <button class="menu-btn" aria-label="More options" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <ul class="menu-dropdown">
            <li id="edit-project">
                <svg class="w-[48px] h-[48px] text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.779 17.779 4.36 19.918 6.5 13.5m4.279 4.279 8.364-8.643a3.027 3.027 0 0 0-2.14-5.165 3.03 3.03 0 0 0-2.14.886L6.5 13.5m4.279 4.279L6.499 13.5m2.14 2.14 6.213-6.504M12.75 7.04 17 11.28"/></svg>
                <p>Edit</p>
            </li>
            <li id="proj-delete">
                <svg class="w-[48px] h-[48px] text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 7h14m-9 3v8m4-8v8M10 3h4a1 1 0 0 1 1 1v3H9V4a1 1 0 0 1 1-1ZM6 7h12v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V7Z"/></svg>
                <p>Delete</p>
            </li>
        </ul>
    </div>
</div>
</html>
